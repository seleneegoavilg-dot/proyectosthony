<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pokémon</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Carga de Three.js para renderizado 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Carga de OrbitControls para rotar 360° con el mouse -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="portal-container">
        <!-- Lienzo 3D donde se dibujarán las estrellas y la galaxia -->
        <canvas id="webgl-canvas"></canvas>

        <!-- Pantalla de bienvenida -->
        <div id="welcome-screen">
            <button id="start-button">Pulsa aquí</button>
        </div>

        <!-- Tarjeta Pop-up (Modal) para mostrar los detalles -->
        <div id="card-modal" class="modal hidden">
            <div class="modal-content">
                <img id="modal-image" src="" alt="Pokémon">
                <h2 id="modal-title">Título</h2>
                <p id="modal-text">Mensaje especial...</p>
                <button id="close-modal-btn">Volver ❤️</button>
            </div>
        </div>
    </div>
<!-- Colócalo antes de cerrar el </body> -->
<audio id="background-music" src="audio/cancion.mp3" loop></audio>
    <script src="js/script.js"></script>
</body>
</html>
